<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HILF reel frame</title>
<style>
  :root { --purple: #6A28D7; --purple-dark: #5B21B6; --ink: #1f2937; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: var(--ink); }
  .wrap { display: flex; gap: 24px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
  canvas { height: min(88vh, 960px); aspect-ratio: 9 / 16; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); background: #222; }
  .panel { width: min(340px, 100%); background: #fff; border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
  label { font-size: 13px; font-weight: 600; display: grid; gap: 6px; min-width: 0; }
  input[type=text], textarea, select { width: 100%; min-width: 0; font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; }
  textarea { min-height: 90px; resize: vertical; }
  .hint { font-size: 12px; color: #6b7280; font-weight: 400; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
  button.primary { background: var(--purple); border-color: var(--purple); color: #fff; }
  button:hover { filter: brightness(.95); }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="panel">
    <label>Guest name <input type="text" id="name" value="Guest Name"></label>
    <label>Quote
      <textarea id="quote">I pretended not to speak English for a *whole year*</textarea>
      <span class="hint">Wrap words in *asterisks* to highlight them in pink.</span>
    </label>
    <label>Handle <input type="text" id="handle" value="@how_i_learned_finnish"></label>
    <div class="row" style="flex-wrap: nowrap;">
      <label style="flex: 1;">Episode <input type="text" id="episode" value="12"></label>
      <label style="flex: 1;">Timestamp <input type="text" id="timestamp" value="" placeholder="23:41"></label>
    </div>
    <label>Call to action <input type="text" id="cta" value="Full episode: link in bio"></label>
    <label>Where to listen
      <select id="platforms">
        <option value="icons">Icons (YouTube, Spotify, Apple Podcasts, web)</option>
        <option value="text">Text</option>
        <option value="off">Hide</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="showText" checked> Show text</label>
    <label class="check"><input type="checkbox" id="showLogo" checked> Show logo badge</label>
    <div class="row">
      <button id="shuffle">New paper texture</button>
    </div>
    <div class="row">
      <button class="primary" id="dlFull">Download background PNG</button>
      <button id="dlOverlay">Download overlay PNG</button>
    </div>
    <span class="hint">Background: put your video on top, at y 656 to 1264 (full width, 1080×608).<br>
    Overlay: same image but the video window is transparent and the torn paper overlaps the video edges. Put this on the layer above your video.</span>
  </div>
</div>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = (id) => document.getElementById(id);
let seed = 7;

function rng(s) {
  return () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Crumpled paper: overlapping light/dark half-planes create faceted folds,
// thin highlight/shadow lines mark the creases, then fine grain on top.
function makePaper(seedValue) {
  const r = rng(seedValue);
  const p = document.createElement('canvas');
  p.width = W; p.height = H;
  const g = p.getContext('2d');
  g.fillStyle = PURPLE;
  g.fillRect(0, 0, W, H);

  const L = 5000;
  // soft-light keeps the purple saturated instead of greying it out
  g.globalCompositeOperation = 'soft-light';
  const facet = (cx, cy, angle, alpha, radius) => {
    const dx = Math.cos(angle), dy = Math.sin(angle);
    const nx = -dy, ny = dx;
    g.save();
    if (radius) { g.beginPath(); g.arc(cx, cy, radius, 0, Math.PI * 2); g.clip(); }
    for (const [sign, color] of [[1, '255,255,255'], [-1, '0,0,0']]) {
      g.beginPath();
      g.moveTo(cx + dx * L, cy + dy * L);
      g.lineTo(cx - dx * L, cy - dy * L);
      g.lineTo(cx - dx * L + nx * L * sign, cy - dy * L + ny * L * sign);
      g.lineTo(cx + dx * L + nx * L * sign, cy + dy * L + ny * L * sign);
      g.closePath();
      g.fillStyle = `rgba(${color},${alpha})`;
      g.fill();
    }
    const len = radius || L;
    g.lineWidth = 2;
    g.strokeStyle = `rgba(255,255,255,${alpha * 2.2})`;
    g.beginPath(); g.moveTo(cx - dx * len, cy - dy * len); g.lineTo(cx + dx * len, cy + dy * len); g.stroke();
    g.lineWidth = 1.5;
    g.strokeStyle = `rgba(0,0,0,${alpha * 2.5})`;
    g.beginPath(); g.moveTo(cx - dx * len + nx * 2, cy - dy * len + ny * 2); g.lineTo(cx + dx * len + nx * 2, cy + dy * len + ny * 2); g.stroke();
    g.restore();
  };

  for (let i = 0; i < 8; i++) facet(r() * W, r() * H, r() * Math.PI, 0.04 + r() * 0.05, 0);
  for (let i = 0; i < 160; i++) facet(r() * W, r() * H, r() * Math.PI, 0.04 + r() * 0.08, 80 + r() * 380);
  g.globalCompositeOperation = 'source-over';

  const img = g.getImageData(0, 0, W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);

  // Soft vignette so the edges feel heavier and the text area pops
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(20,0,50,0.28)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  return p;
}

function tornEdge(r, baseY) {
  const pts = [];
  const phases = [r() * 6, r() * 6, r() * 6];
  for (let x = -20; x <= W + 20; x += 5 + r() * 10) {
    const wave = Math.sin(x / 140 + phases[0]) * 7 + Math.sin(x / 47 + phases[1]) * 4 + Math.sin(x / 19 + phases[2]) * 2;
    pts.push([x, baseY + wave + (r() - 0.5) * 9]);
  }
  return pts;
}

function piece(edge, isTop) {
  const path = new Path2D();
  path.moveTo(-20, isTop ? -20 : H + 20);
  for (const [x, y] of edge) path.lineTo(x, y);
  path.lineTo(W + 20, isTop ? -20 : H + 20);
  path.closePath();
  return path;
}

function drawPiece(paper, edge, isTop, r) {
  const dir = isTop ? 1 : -1;
  // Pale torn fibre showing past the purple surface
  const fibre = edge.map(([x, y]) => [x, y + dir * (4 + r() * 9)]);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 22;
  ctx.shadowOffsetY = 8 * dir;
  ctx.fillStyle = '#EDE3FB';
  ctx.fill(piece(fibre, isTop));
  ctx.restore();

  ctx.save();
  ctx.clip(piece(edge, isTop));
  ctx.drawImage(paper, 0, 0);
  ctx.restore();
}

function wrapWords(text, maxWidth) {
  const words = text.toUpperCase().split(/\s+/).filter(Boolean);
  let hl = false;
  const tokens = words.map((w) => {
    const start = w.startsWith('*');
    if (start) hl = true;
    const end = w.endsWith('*');
    const tok = { text: w.replace(/\*/g, ''), hl };
    if (end) hl = false;
    return tok;
  });
  const lines = [[]];
  const space = ctx.measureText(' ').width;
  let width = 0;
  for (const t of tokens) {
    const w = ctx.measureText(t.text).width;
    if (lines[lines.length - 1].length && width + space + w > maxWidth) { lines.push([]); width = 0; }
    const line = lines[lines.length - 1];
    width += (line.length ? space : 0) + w;
    line.push(t);
  }
  return lines;
}

function drawText(bottomY) {
  const name = $('name').value.toUpperCase();
  const quote = $('quote').value;
  const handle = $('handle').value.toUpperCase();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(30,0,70,0.35)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;

  ctx.font = `66px ${FONT}`;
  const lines = wrapWords(quote, 940);
  const quoteLH = 76;
  let y = bottomY - 70 - (lines.length - 1) * quoteLH;

let paperCache = { seed: null, canvas: null };

function render(mode = 'full') {
  if (paperCache.seed !== seed) paperCache = { seed, canvas: makePaper(seed) };
  const paper = paperCache.canvas;
  const r = rng(seed * 31 + 1);
  const overlay = mode === 'overlay';

  ctx.clearRect(0, 0, W, H);
  if (!overlay) { ctx.fillStyle = BACKDROP; ctx.fillRect(0, VIDEO_TOP - 60, W, VIDEO_BOTTOM - VIDEO_TOP + 120); }

  // In the overlay the paper bites ~22px into the video; in the background it stops just short of it.
  const bite = overlay ? 22 : -26;
  const topEdge = tornEdge(r, VIDEO_TOP + bite);
  const bottomEdge = tornEdge(r, VIDEO_BOTTOM - bite);
  drawPiece(paper, topEdge, true, r);
  drawPiece(paper, bottomEdge, false, r);

  if ($('showText').checked) drawText(VIDEO_TOP - 60);

  drawBottom(VIDEO_BOTTOM + 40);
}

// Bottom section, kept above ~y 1700 where Instagram's caption and buttons sit.
function drawBottom(top) {
  let y = top;

  if ($('showLogo').checked && logo.complete && logo.naturalWidth) {
    const size = 150, x = (W - size) / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.beginPath(); ctx.roundRect(x - 7, y - 7, size + 14, size + 14, 20); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x, y, size, size, 14); ctx.clip();
    ctx.drawImage(logo, x, y, size, size);
    ctx.restore();
    y += size + 40;
  }

  const ep = $('episode').value.trim();
  const ts = $('timestamp').value.trim();
  const label = [ep && (/^\d+$/.test(ep) ? `Episode ${ep}` : ep), ts].filter(Boolean).join('  •  ').toUpperCase();
  if (label) {
    ctx.font = `46px ${FONT}`;
    ctx.save(); ctx.letterSpacing = '2px';
    const tw = ctx.measureText(label).width;
    const pw = tw + 56, ph = 74;
    ctx.translate(W / 2, y + ph / 2);
    ctx.rotate(-0.025);
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    ctx.fillStyle = PINK;
    ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#3B0764';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 3);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
    y += ph + 62;
  }

  const cta = $('cta').value.trim().toUpperCase();
  if (cta) {
    ctx.save();
    ctx.shadowColor = 'rgba(30,0,70,0.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.font = `52px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.letterSpacing = '2px';
    ctx.fillText(cta, W / 2, y);
    ctx.restore();
    y += 52;
  }

  const platforms = $('platforms').value;
  if (platforms === 'icons') {
    const chip = 80, gap = 30, icon = 50;
    let x = (W - (platformIcons.length * chip + (platformIcons.length - 1) * gap)) / 2;
    const top = y - 14;
    for (const img of platformIcons) {
      const cx = x + chip / 2, cy = top + chip / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
      ctx.beginPath(); ctx.arc(cx, cy, chip / 2, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.restore();
      if (img.complete && img.naturalWidth) ctx.drawImage(img, cx - icon / 2, cy - icon / 2, icon, icon);
      x += chip + gap;
    }
  } else if (platforms === 'text') {
    ctx.save();
    ctx.textAlign = 'center'; ctx.fillStyle = LAVENDER;
    ctx.font = `30px ${FONT}`; ctx.letterSpacing = '5px';
    ctx.fillText('YOUTUBE  •  SPOTIFY  •  APPLE PODCASTS', W / 2, y);
    ctx.font = `34px ${FONT}`; ctx.letterSpacing = '4px';
    ctx.fillText(WEBSITE, W / 2, y + 46);
    ctx.restore();
  }
}

function download(mode) {
  render(mode);
  // e.g. Guest_Name_I_pretended_not_to_s_background.png
  const quoteStart = $('quote').value.replace(/\*/g, '').trim().slice(0, 20);
  const slug = `${$('name').value.trim()} ${quoteStart}`
    .replace(/[^\p{L}\p{N}]+/gu, '_')
    .replace(/^_+|_+$/g, '') || 'reel';
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${slug}_${mode}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
    render();
  }, 'image/png');
}

['name', 'quote', 'handle', 'episode', 'timestamp', 'cta', 'platforms', 'showText', 'showLogo'].forEach((id) => $(id).addEventListener('input', () => render()));
$('shuffle').onclick = () => { seed = Math.floor(Math.random() * 1e6); render(); };
$('dlFull').onclick = () => download('background');
$('dlOverlay').onclick = () => download('overlay');
document.fonts.ready.then(() => render());
render();
</script>
</body>
</html>
